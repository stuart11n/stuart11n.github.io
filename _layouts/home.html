<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}
  <body class="home">
    {%- include header.html -%}
    <main class="page-content" aria-label="Content">
      <section class="hero">
        <div class="hero__glow" aria-hidden="true"></div>
        <div class="wrapper hero__inner">
          <div class="hero__copy">
            <p class="hero__brand">{{ site.title | escape }}</p>
            <h1 class="hero__title">Hardware built for the cockpit and the cave.</h1>
            <p class="hero__lede">Flight panels, VR-friendly encoders, and sim-rig parts made in San Diego.</p>
            <div class="hero__actions project-filters" role="group" aria-label="Filter projects">
              <a class="btn btn--primary" href="{{ site.shop_url }}" target="_blank" rel="noopener noreferrer">Shop on Etsy</a>
              <button type="button" class="btn btn--ghost filter-btn" data-filter="product">Products</button>
              <button type="button" class="btn btn--ghost filter-btn" data-filter="project">Projects</button>
              <button type="button" class="btn btn--ghost filter-btn" data-filter="audio">Audio</button>
              <button type="button" class="btn btn--ghost filter-btn" data-filter="software">Software</button>
            </div>
          </div>
          <div class="hero__visual" aria-hidden="true">
            <img src="{{ "/assets/images/fc-plus.jpg" | relative_url }}" alt="" class="hero__img hero__img--main" id="hero-img-main" width="800" height="600">
            <img src="{{ "/assets/images/IMG_2121.jpg" | relative_url }}" alt="" class="hero__img hero__img--float" id="hero-img-float" width="400" height="400">
          </div>
        </div>
      </section>

      <div class="wrapper">
        <div id="projects" class="projects-anchor">
          {{ content }}
        </div>
      </div>
    </main>
    {%- include footer.html -%}
  </body>
</html>
