<header class="site-header" role="banner">
  <div class="wrapper site-header__inner">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
      <img class="site-logo" src="{{ "/assets/images/logo.jpg" | relative_url }}" alt="" width="44" height="44">
      <span class="site-title__text">{{ site.title | escape }}</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger" class="menu-icon" aria-label="Open menu">
        <span></span>
        <span></span>
      </label>

      <div class="trigger">
        <a class="page-link{% if page.url == '/' %} is-active{% endif %}" href="{{ "/" | relative_url }}">Projects</a>
        <a class="page-link{% if page.url == '/about/' %} is-active{% endif %}" href="{{ "/about/" | relative_url }}">About</a>
        <a class="page-link page-link--shop" href="{{ site.shop_url }}" target="_blank" rel="noopener noreferrer">Etsy</a>
      </div>
    </nav>
  </div>
</header>
