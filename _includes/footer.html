<footer class="site-footer">
  <div class="wrapper site-footer__inner">
    <div class="site-footer__brand">
      <img class="site-logo site-logo--sm" src="{{ "/assets/images/logo.jpg" | relative_url }}" alt="" width="36" height="36">
      <div>
        <p class="site-footer__title">{{ site.title | escape }}</p>
        <p class="site-footer__tag">Hardware for flight sim, racing, and the workshop.</p>
      </div>
    </div>
    <div class="site-footer__links">
      <a href="{{ site.shop_url }}" target="_blank" rel="noopener noreferrer">Etsy shop</a>
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      <a href="{{ "/disclaimer/" | relative_url }}">Disclaimer</a>
    </div>
  </div>
</footer>
<script src="{{ "/assets/js/site.js" | relative_url }}" defer></script>
